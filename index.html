<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aviral Gupta — Performance Reviews</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #111418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1072px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    .sub { color: #6b7280; font-size: 14px; margin: 6px 0 36px; }
    figure { margin: 0 0 44px; }
    figcaption { font-size: 14px; font-weight: 600; color: #111418; margin: 0 0 10px; }
    figcaption span { font-weight: 400; color: #6b7280; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #e8eaed;
      border-radius: 8px;
    }
    @media (max-width: 560px) { .wrap { padding: 28px 14px 56px; } }
    @media print {
      .wrap { padding: 0; max-width: none; }
      figure { break-inside: avoid; page-break-inside: avoid; }
      img { border-color: #ddd; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <figure>
